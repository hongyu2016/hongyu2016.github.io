<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'Consolas', monospace">
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5b6274" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="410" height="330" rx="12" fill="#ffffff" stroke="#dfe3ec"/>
  <text x="40" y="46" font-size="13" font-weight="600" fill="#1a1f36">源码（一个仓库，多包）</text>
  <text x="40" y="72" font-size="11.5" fill="#5b6274">projects-web/</text>
  <text x="40" y="92" font-size="11.5" fill="#5b6274">├─ runtime/          基座壳 + 模块外壳</text>
  <text x="40" y="112" font-size="11.5" fill="#5b6274">├─ ypack/            构建封装（webpack 配置工厂）</text>
  <text x="40" y="132" font-size="11.5" fill="#5b6274">├─ yugecore/         内核：loader / registry / request</text>
  <text x="40" y="152" font-size="11.5" fill="#5b6274">├─ yui/              组件库（antd 收口，全局唯一）</text>
  <text x="40" y="172" font-size="11.5" fill="#5b6274">├─ yugecharts/       业务级共享图表包</text>
  <text x="40" y="192" font-size="11.5" fill="#5b6274">└─ di-engine/        一个微应用</text>
  <text x="40" y="212" font-size="11.5" fill="#2f6bff">   ├─ yuge.manifest.json   ← 菜单/权限声明</text>
  <text x="40" y="232" font-size="11.5" fill="#5b6274">   └─ src/</text>
  <text x="40" y="252" font-size="11.5" fill="#2f6bff">      ├─ desktop/     四件套：index / app / menu / api</text>
  <text x="40" y="272" font-size="11.5" fill="#5b6274">      ├─ manage/      同一套结构，按端切分</text>
  <text x="40" y="292" font-size="11.5" fill="#5b6274">      └─ mobile/</text>
  <rect x="40" y="306" width="370" height="28" rx="6" fill="#f4f6fa"/>
  <text x="52" y="325" font-size="11" fill="#5b6274">三端共享 api / components / hooks，不复制代码</text>

  <path d="M436 185 L466 185" fill="none" stroke="#5b6274" stroke-width="1.6" marker-end="url(#c)"/>
  <text x="451" y="176" font-size="10.5" text-anchor="middle" fill="#8a90a2">ypack</text>

  <rect x="470" y="20" width="410" height="330" rx="12" fill="#ffffff" stroke="#dfe3ec"/>
  <text x="490" y="46" font-size="13" font-weight="600" fill="#1a1f36">产物（nginx 站点根）</text>
  <text x="490" y="72" font-size="11.5" fill="#5b6274">html/</text>
  <text x="490" y="92" font-size="11.5" fill="#5b6274">├─ index.html                基座入口</text>
  <text x="490" y="112" font-size="11.5" fill="#5b6274">├─ assets/index.&lt;hash&gt;.js    基座 bundle</text>
  <text x="490" y="132" font-size="11.5" fill="#5b6274">├─ static/vendor.js          共享依赖（独立运行用）</text>
  <text x="490" y="152" font-size="11.5" fill="#5b6274">├─ config.js                 部署期配置，可改不必重构建</text>
  <text x="490" y="172" font-size="11.5" fill="#5b6274">└─ di-engine/</text>
  <text x="490" y="192" font-size="11.5" fill="#5b6274">   ├─ manage/</text>
  <text x="490" y="212" font-size="11.5" fill="#2f6bff">   │  ├─ manifest.json       ← 基座唯一契约</text>
  <text x="490" y="232" font-size="11.5" fill="#5b6274">   │  ├─ index.js            UMD，externals 外置依赖</text>
  <text x="490" y="252" font-size="11.5" fill="#5b6274">   │  ├─ style.css           已加 .yuge-app-di-engine 前缀</text>
  <text x="490" y="272" font-size="11.5" fill="#5b6274">   │  └─ api.js              对外导出的能力</text>
  <text x="490" y="292" font-size="11.5" fill="#5b6274">   ├─ desktop/</text>
  <text x="490" y="312" font-size="11.5" fill="#5b6274">   └─ mobile/</text>
  <text x="490" y="336" font-size="11.5" fill="#8a90a2">/modules/di-engine/manage/index.js  ⇄  上面这个目录</text>

  <rect x="20" y="368" width="860" height="232" rx="12" fill="#ffffff" stroke="#dfe3ec"/>
  <text x="40" y="394" font-size="13" font-weight="600" fill="#1a1f36">manifest.json —— 产物自己说清楚"我是谁、入口在哪、菜单有什么"</text>
  <rect x="40" y="408" width="820" height="172" rx="8" fill="#f8faff" stroke="#eef1f6"/>
  <text x="58" y="430" font-size="11.5" fill="#5b6274">{</text>
  <text x="72" y="450" font-size="11.5" fill="#1a1f36">"name": "di-engine",      "version": "1.0.0",     "end": "manage",</text>
  <text x="72" y="470" font-size="11.5" fill="#2f6bff">"entry": "index.js",      "style": "style.css",   "api": "api.js",</text>
  <text x="72" y="490" font-size="11.5" fill="#1a1f36">"global": "YugeApp_di_engine",   "hash": "af3b0fcf",</text>
  <text x="72" y="510" font-size="11.5" fill="#1a1f36">"menus": [</text>
  <text x="86" y="530" font-size="11.5" fill="#5b6274">{ "key": "di-engine/charts", "label": "图表管理" },</text>
  <text x="86" y="548" font-size="11.5" fill="#5b6274">{ "key": "di-engine/designer", "label": "图表设计器" }</text>
  <text x="72" y="566" font-size="11.5" fill="#1a1f36">],</text>
  <text x="58" y="578" font-size="11.5" fill="#5b6274">}</text>
  <text x="330" y="490" font-size="11" fill="#8a90a2">entry / style / api 是相对文件名，</text>
  <text x="330" y="508" font-size="11" fill="#8a90a2">注册时补成 /modules/&lt;app&gt;/&lt;end&gt;/xxx，</text>
  <text x="330" y="526" font-size="11" fill="#8a90a2">基座只认这份契约，不认识任何业务代码。</text>
</svg>
