<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2f6bff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <line x1="70" y1="60" x2="70" y2="640" stroke="#dfe3ec" stroke-width="2"/>

  <circle cx="70" cy="76" r="17" fill="#2f6bff"/>
  <text x="70" y="82" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
  <rect x="110" y="48" width="330" height="56" rx="9" fill="#ffffff" stroke="#dfe3ec"/>
  <text x="130" y="70" font-size="13" font-weight="600" fill="#1a1f36">登录，拿到 token</text>
  <text x="130" y="89" font-size="11" fill="#5b6274">基座把 token 交给 request 统一携带</text>
  <text x="460" y="70" font-size="11" fill="#8a90a2">POST /data/auth/login</text>
  <text x="460" y="89" font-size="11" fill="#8a90a2">→ { token, user, permissions }</text>

  <path d="M70 93 L70 145" fill="none" stroke="#2f6bff" stroke-width="1.6" marker-end="url(#b)"/>

  <circle cx="70" cy="168" r="17" fill="#2f6bff"/>
  <text x="70" y="174" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
  <rect x="110" y="140" width="330" height="56" rx="9" fill="#ffffff" stroke="#dfe3ec"/>
  <text x="130" y="162" font-size="13" font-weight="600" fill="#1a1f36">拉取应用清单</text>
  <text x="130" y="181" font-size="11" fill="#5b6274">只取当前端，只取有权限的菜单</text>
  <text x="460" y="162" font-size="11" fill="#8a90a2">GET /data/platform/bootstrap</text>
  <text x="460" y="181" font-size="11" fill="#8a90a2">→ apps[ ].{ name, entry, menus, api }</text>

  <path d="M70 185 L70 237" fill="none" stroke="#2f6bff" stroke-width="1.6" marker-end="url(#b)"/>

  <circle cx="70" cy="260" r="17" fill="#2f6bff"/>
  <text x="70" y="266" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
  <rect x="110" y="232" width="330" height="56" rx="9" fill="#ffffff" stroke="#dfe3ec"/>
  <text x="130" y="254" font-size="13" font-weight="600" fill="#1a1f36">注册进 registry</text>
  <text x="130" y="273" font-size="11" fill="#5b6274">此时只登记元数据，不加载任何 JS</text>
  <rect x="460" y="240" width="400" height="40" rx="6" fill="#f4f6fa"/>
  <text x="475" y="256" font-size="11" fill="#1a1f36">data.apps.forEach(a =&gt; registry.register(a))</text>
  <text x="475" y="272" font-size="11" fill="#8a90a2">首屏代价 ≈ 一次接口请求，与应用数量基本无关</text>

  <path d="M70 277 L70 329" fill="none" stroke="#2f6bff" stroke-width="1.6" marker-end="url(#b)"/>

  <circle cx="70" cy="352" r="17" fill="#2f6bff"/>
  <text x="70" y="358" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">4</text>
  <rect x="110" y="324" width="330" height="56" rx="9" fill="#ffffff" stroke="#dfe3ec"/>
  <text x="130" y="346" font-size="13" font-weight="600" fill="#1a1f36">点菜单，命中路由</text>
  <text x="130" y="365" font-size="11" fill="#5b6274">AppHost 从 URL 解析 appName 与端</text>
  <text x="460" y="346" font-size="11" fill="#8a90a2">/manage/di-engine/charts</text>
  <text x="460" y="365" font-size="11" fill="#8a90a2">→ appName = di-engine, end = manage</text>

  <path d="M70 369 L70 421" fill="none" stroke="#2f6bff" stroke-width="1.6" marker-end="url(#b)"/>

  <circle cx="70" cy="444" r="17" fill="#2f6bff"/>
  <text x="70" y="450" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">5</text>
  <rect x="110" y="416" width="330" height="56" rx="9" fill="#ffffff" stroke="#dfe3ec"/>
  <text x="130" y="438" font-size="13" font-weight="600" fill="#1a1f36">加载该应用的产物</text>
  <text x="130" y="457" font-size="11" fill="#5b6274">同一份 URL 二次进入直接命中缓存</text>
  <text x="460" y="438" font-size="11" fill="#8a90a2">GET /modules/di-engine/manage/index.js</text>
  <text x="460" y="457" font-size="11" fill="#8a90a2">→ window.YugeApp_di_engine</text>

  <path d="M70 461 L70 513" fill="none" stroke="#2f6bff" stroke-width="1.6" marker-end="url(#b)"/>

  <circle cx="70" cy="536" r="17" fill="#2f6bff"/>
  <text x="70" y="542" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">6</text>
  <rect x="110" y="508" width="330" height="56" rx="9" fill="#ffffff" stroke="#dfe3ec"/>
  <text x="130" y="530" font-size="13" font-weight="600" fill="#1a1f36">挂载渲染</text>
  <text x="130" y="549" font-size="11" fill="#5b6274">交给微应用自己的 mount，基座不再介入</text>
  <rect x="460" y="516" width="400" height="40" rx="6" fill="#f4f6fa"/>
  <text x="475" y="532" font-size="11" fill="#1a1f36">mod.mount(container, { route, navigate, user })</text>
  <text x="475" y="548" font-size="11" fill="#8a90a2">导航能力由基座注入，微应用不持有 History</text>

  <rect x="110" y="588" width="750" height="72" rx="10" fill="#f0f8f4" stroke="#b6ddc9"/>
  <text x="130" y="612" font-size="12" font-weight="600" fill="#0f6e56">关键取舍</text>
  <text x="130" y="632" font-size="11" fill="#3f6b58">清单在启动时一次拉全，产物在进入应用时才加载 —— 应用越多，首屏越不该等它们。</text>
  <text x="130" y="650" font-size="11" fill="#3f6b58">这也是为什么 registry 只存元数据、loader 做懒加载，而不是启动就把所有 bundle 预取下来。</text>
</svg>
