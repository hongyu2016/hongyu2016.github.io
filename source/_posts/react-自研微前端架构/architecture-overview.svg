<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5b6274" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="860" height="330" rx="14" fill="#f8faff" stroke="#dfe3ec"/>
  <text x="40" y="48" font-size="15" font-weight="600" fill="#1a1f36">浏览器（同一棵 React 树）</text>

  <rect x="40" y="62" width="820" height="104" rx="10" fill="#ffffff" stroke="#2f6bff"/>
  <text x="60" y="86" font-size="14" font-weight="600" fill="#1a1f36">基座 runtime（只做四件事）</text>
  <rect x="60" y="98" width="180" height="52" rx="6" fill="#eef2ff" stroke="#c9d6ff"/>
  <text x="150" y="118" font-size="12" text-anchor="middle" fill="#1a1f36">布局 Layout</text>
  <text x="150" y="137" font-size="11" text-anchor="middle" fill="#5b6274">侧边菜单 + 顶栏 + 内容区</text>
  <rect x="252" y="98" width="180" height="52" rx="6" fill="#eef2ff" stroke="#c9d6ff"/>
  <text x="342" y="118" font-size="12" text-anchor="middle" fill="#1a1f36">路由 Router</text>
  <text x="342" y="137" font-size="11" text-anchor="middle" fill="#5b6274">独占 History，分发 URL</text>
  <rect x="444" y="98" width="180" height="52" rx="6" fill="#eef2ff" stroke="#c9d6ff"/>
  <text x="534" y="118" font-size="12" text-anchor="middle" fill="#1a1f36">加载器 Loader</text>
  <text x="534" y="137" font-size="11" text-anchor="middle" fill="#5b6274">按 entry 加载产物</text>
  <rect x="636" y="98" width="212" height="52" rx="6" fill="#eef2ff" stroke="#c9d6ff"/>
  <text x="742" y="118" font-size="12" text-anchor="middle" fill="#1a1f36">全局依赖注入</text>
  <text x="742" y="137" font-size="11" text-anchor="middle" fill="#5b6274">React / antd / 内核唯一实例</text>

  <path d="M190 166 L190 186" fill="none" stroke="#5b6274" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M470 166 L470 186" fill="none" stroke="#5b6274" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M750 166 L750 186" fill="none" stroke="#5b6274" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="40" y="188" width="250" height="136" rx="10" fill="#ffffff" stroke="#dfe3ec"/>
  <text x="165" y="212" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1f36">di-engine</text>
  <text x="165" y="232" font-size="11" text-anchor="middle" fill="#8a90a2">数据中台</text>
  <rect x="58" y="246" width="214" height="26" rx="5" fill="#f4f6fa"/>
  <text x="165" y="263" font-size="11" text-anchor="middle" fill="#5b6274">index.tsx / app.tsx / menu.ts / api.ts</text>
  <rect x="58" y="278" width="214" height="26" rx="5" fill="#f4f6fa"/>
  <text x="165" y="295" font-size="11" text-anchor="middle" fill="#5b6274">routes 数组 · 不含路由实例</text>

  <rect x="305" y="188" width="250" height="136" rx="10" fill="#ffffff" stroke="#dfe3ec"/>
  <text x="430" y="212" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1f36">sys-admin</text>
  <text x="430" y="232" font-size="11" text-anchor="middle" fill="#8a90a2">系统管理</text>
  <rect x="323" y="246" width="214" height="26" rx="5" fill="#f4f6fa"/>
  <text x="430" y="263" font-size="11" text-anchor="middle" fill="#5b6274">index.tsx / app.tsx / menu.ts / api.ts</text>
  <rect x="323" y="278" width="214" height="26" rx="5" fill="#f4f6fa"/>
  <text x="430" y="295" font-size="11" text-anchor="middle" fill="#5b6274">routes 数组 · 不含路由实例</text>

  <rect x="570" y="188" width="290" height="136" rx="10" fill="#ffffff" stroke="#dfe3ec" stroke-dasharray="4 3"/>
  <text x="715" y="212" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1f36">… 新增应用</text>
  <text x="715" y="234" font-size="11" text-anchor="middle" fill="#8a90a2">构建产物并注册即可，基座零改动</text>
  <rect x="588" y="252" width="254" height="26" rx="5" fill="#f4f6fa"/>
  <text x="715" y="269" font-size="11" text-anchor="middle" fill="#5b6274">同一套四件套约定</text>
  <rect x="588" y="284" width="254" height="26" rx="5" fill="#f4f6fa"/>
  <text x="715" y="301" font-size="11" text-anchor="middle" fill="#5b6274">独立仓库 / 独立发布节奏</text>

  <path d="M450 350 L450 386" fill="none" stroke="#5b6274" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="466" y="374" font-size="11" fill="#8a90a2">GET /modules/&lt;app&gt;/&lt;end&gt;/index.js</text>

  <rect x="20" y="388" width="860" height="96" rx="12" fill="#ffffff" stroke="#dfe3ec"/>
  <text x="40" y="414" font-size="14" font-weight="600" fill="#1a1f36">nginx</text>
  <text x="40" y="436" font-size="11" fill="#8a90a2">纯静态，不认识任何业务</text>
  <rect x="40" y="444" width="820" height="26" rx="5" fill="#f4f6fa"/>
  <text x="450" y="461" font-size="11" text-anchor="middle" fill="#5b6274">location ^~ /modules/ { alias /usr/share/nginx/html/; }   →   /modules/di-engine/manage/index.js  ⇄  html/di-engine/manage/index.js</text>

  <path d="M450 484 L450 516" fill="none" stroke="#5b6274" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="466" y="505" font-size="11" fill="#8a90a2">GET /data/platform/bootstrap?end=manage</text>

  <rect x="20" y="518" width="860" height="104" rx="12" fill="#f8faff" stroke="#dfe3ec"/>
  <text x="40" y="544" font-size="14" font-weight="600" fill="#1a1f36">清单服务</text>
  <rect x="40" y="556" width="400" height="48" rx="8" fill="#ffffff" stroke="#c9d6ff"/>
  <text x="240" y="575" font-size="12" text-anchor="middle" fill="#1a1f36">FastAPI</text>
  <text x="240" y="593" font-size="11" text-anchor="middle" fill="#5b6274">按端 + 权限过滤后下发应用清单</text>
  <rect x="460" y="556" width="400" height="48" rx="8" fill="#ffffff" stroke="#c9d6ff"/>
  <text x="660" y="575" font-size="12" text-anchor="middle" fill="#1a1f36">MySQL · app_registry</text>
  <text x="660" y="593" font-size="11" text-anchor="middle" fill="#5b6274">只存元数据：菜单 / 入口 / hash / 权限</text>
  <path d="M440 580 L456 580" fill="none" stroke="#5b6274" stroke-width="1.4" marker-end="url(#a)"/>
</svg>
